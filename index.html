<html>
    <head>
        <title>Test</title> 
    </head>
    <body>
        <h1>Test</h1>
        <p>Fetching metadata...</p>
        <pre id="output"></pre>
        
        <script>
            async function fetchMetadata() {
                try {
                    const response = await fetch('http://169.254.169.254/latest/meta-data/');
                    const text = await response.text();
                    document.getElementById("output").innerText = text;
                } catch (e) {
                    document.getElementById("output").innerText = "Failed to fetch metadata: " + e.message;
                }
            }
            fetchMetadata();
        </script>
    </body>
</html>
